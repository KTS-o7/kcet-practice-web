# /etc/nginx/sites-available/kcet.shenthar.me  (symlink into sites-enabled)
server {
    listen 80;
    listen [::]:80;
    server_name kcet.shenthar.me;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name kcet.shenthar.me;

    # certbot --nginx fills these in
    # ssl_certificate     /etc/letsencrypt/live/kcet.shenthar.me/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/kcet.shenthar.me/privkey.pem;

    include snippets/security-headers.conf;
    include snippets/rate-limit.conf;
    add_header X-Robots-Tag "noindex, nofollow" always;

    client_max_body_size 1M;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location /api/login {
        limit_req zone=api burst=5 nodelay;
        include snippets/proxy-params.conf;
        proxy_pass http://127.0.0.1:8093;
    }

    location / {
        include snippets/proxy-params.conf;
        proxy_pass http://127.0.0.1:8093;
    }
}
